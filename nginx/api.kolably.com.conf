server {
    listen 80;
    server_name api.kolably.com;

    # The default client_max_body_size is 1MB, which would reject the backend's
    # 5MB image uploads (POST /upload/image) with a 413 before they ever reach
    # FastAPI. Allow a little headroom over 5MB for multipart framing overhead.
    client_max_body_size 6m;

    location / {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
