name: Deploy Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Spins up local Postgres + GoTrue + Storage in Docker and applies
      # migrations/ (symlinked at supabase/migrations) — hermetic, thrown
      # away at the end of the job. See tests_integration/README.md.
      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase env vars
        run: |
          supabase status -o env | sed 's/"//g' > /tmp/supabase_status.env
          # shellcheck disable=SC2013
          for pair in \
            "API_URL=SUPABASE_URL" \
            "ANON_KEY=SUPABASE_KEY" \
            "SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY" \
            "JWT_SECRET=SUPABASE_JWT_SECRET"; do
            src="${pair%%=*}"
            dst="${pair##*=}"
            value="$(grep "^${src}=" /tmp/supabase_status.env | cut -d= -f2-)"
            echo "${dst}=${value}" >> "$GITHUB_ENV"
          done

      - name: Run integration tests
        run: pytest tests_integration/ -v

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create project archive
        run: |
          mkdir -p build_output
          tar --exclude=./build_output -czf build_output/kolably_backend.tar.gz .

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer archive to EC2
        run: |
          scp -i ~/.ssh/key.pem build_output/kolably_backend.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/kolably_backend.tar.gz

      - name: Deploy on EC2 via SSH
        run: |
          ssh -i ~/.ssh/key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            # Decompress and setup
            rm -rf kolably_backend_v2
            mkdir -p kolably_backend_v2
            tar -xzf kolably_backend.tar.gz -C kolably_backend_v2
            cd kolably_backend_v2
            
            # Copy existing .env if present
            if [ -f ../kolably_backend/.env ]; then
              cp ../kolably_backend/.env .env
            fi
            
            # Free disk space before the build — --no-cache forces a full
            # rebuild every deploy, and the previous image tag just gets
            # silently orphaned (docker rm below only removes the old
            # *container*, never the image), so dangling images and build
            # cache accumulate on every single deploy with nothing here ever
            # clearing them. `docker system prune` skips anything still in
            # use by a running container, so this is safe to run before the
            # old container is even stopped.
            echo "Disk usage before cleanup:"
            df -h /
            sudo docker system prune -af --volumes
            echo "Disk usage after cleanup:"
            df -h /

            # Build and Deploy
            sudo docker build --no-cache -t kolably-backend-cicd .
            sudo docker rm -f kolably-backend-prod || true
            sudo docker run -d --name kolably-backend-prod -p 8001:8000 --env-file .env kolably-backend-cicd
            
            # Reload Nginx
            sudo systemctl reload nginx
            
            # Cleanup
            cd ..
            rm -rf kolably_backend
            mv kolably_backend_v2 kolably_backend
            rm kolably_backend.tar.gz
          EOF
