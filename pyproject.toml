[project]
name = "kolably-backend"
version = "0.1.0"
description = "Kolably — Local Business × Creator Collaboration Marketplace API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "supabase>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "pyotp>=2.9.0",
    "apscheduler>=3.11.3",
    "slowapi>=0.1.9",
    "pillow>=11.0.0",
    "email-validator>=2.3.0",
    "boto3>=1.43.83",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.16.4",
    "pre-commit>=3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
