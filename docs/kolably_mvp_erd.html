
<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  PROFILES ||--o| CREATORS : "extends"
  PROFILES ||--o| BUSINESSES : "extends"
  CREATORS ||--o{ PORTFOLIO_ITEMS : has
  CREATORS ||--o{ SAVED_CAMPAIGNS : saves
  BUSINESSES ||--o{ CAMPAIGNS : posts
  CAMPAIGNS ||--o{ SAVED_CAMPAIGNS : "saved as"
  CAMPAIGNS ||--o{ CAMPAIGN_APPLICATIONS : receives
  CREATORS ||--o{ CAMPAIGN_APPLICATIONS : sends
  CAMPAIGN_APPLICATIONS ||--o| COLLABORATIONS : accepted_into
  CAMPAIGNS ||--o{ COLLABORATIONS : produces
  COLLABORATIONS ||--o{ CONTENT_SUBMISSIONS : contains
  COLLABORATIONS ||--o| CONVERSATIONS : opens
  CONVERSATIONS ||--o{ CONVERSATION_PARTICIPANTS : includes
  CONVERSATIONS ||--o{ MESSAGES : contains
  CONVERSATIONS ||--o{ CONVERSATION_READS : tracked_by
  PROFILES ||--o{ NOTIFICATIONS : receives
  PROFILES ||--o{ CONVERSATION_PARTICIPANTS : joins

  PROFILES {
    uuid id PK
    uuid auth_id FK
    text role
  }
  CREATORS {
    uuid id PK
    uuid profile_id FK
    text niche
    int follower_count
  }
  BUSINESSES {
    uuid id PK
    uuid profile_id FK
    bool is_verified
  }
  CAMPAIGNS {
    uuid id PK
    uuid business_id FK
    text status
    jsonb deliverables
  }
  CAMPAIGN_APPLICATIONS {
    uuid id PK
    uuid campaign_id FK
    uuid creator_id FK
    text direction
    text status
  }
  COLLABORATIONS {
    uuid id PK
    uuid application_id FK
    uuid campaign_id FK
    text status
  }
  CONTENT_SUBMISSIONS {
    uuid id PK
    uuid collaboration_id FK
    text platform
  }
  NOTIFICATIONS {
    uuid id PK
    uuid profile_id FK
    text type
  }`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
